<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Properties</title>
    <style>
        *{
            margin: 0px;
            background: #000;
            color: white;
            box-sizing: border-box;
        }
        .first{
            border: 2px solid white;
            height: 200px;
            width: 200px;
            padding: 10px;
            margin-right: 20px;
        }
        .second{
            margin: 20px 30px 40px 50px;
            border: 1px solid white;
            padding: 20px;
            height: 200px;
            width: 200px;
            margin-right: 20px;

        }
    </style>
</head>
<body>
    <div class="first">
        this is content inside first box
    </div>
    <div class="second">
        this is a aheading element
    </div>
    <h1>This is a heading element</h1>

</body>
</html>
