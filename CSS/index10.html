<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #000;
        }
        .container{
            border: 2px solid white;
        }
        img{
            height: 400px;
            width: 400px;
        }
        .image{
            position: static;
            top: 20px;
            left: 20px;
        }
        .image1{
            position: static;
            top: 20px;
            left: 40px;
        }
        .image2{
            position: absolute;
            top: 20px;
            left: 40px;
        }
        .image3{
            position: fixed;
            padding-top: 100px;
        }
        .container2{
            height: 800px;
            width: 200px;
        }
        .fifth{
            position: sticky;
            border: 2px;
            left: 800px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <img src="image.png" alt="image2" class="image">
        <img src="image1.png" alt="image1" class="image1">
        <img src="image2.png" alt="image2" class="image2">
        <img src="image3.png" alt="image3" class="image3">
    </div>

    <div class="container2">
        this is content inside container2
    </div>
    <img src="image3.png" alt="">

</body>
</html>
