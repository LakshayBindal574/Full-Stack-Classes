<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background: #000;
            color: aliceblue;
        }
        .external{
            background-color: #000;
        }
        div p{
            padding-left: 50px;
            height: 100;
        }
        div.second > p {
            color: green;
        }
        h6, p, p{
            color: darkolivegreen;
        }
    </style>
</head>
<body>
    <h1 style="color:blue; background: aqua;">This is heading</h1>
    <p style="color:white; background: #000;">Paragraph</p>
    <article>This is Article</article>
    <br>
    <br>
    <div class="external">
        Hello
    </div>
    <div class="first">
        This is a div tag
    </div>
    <div class="second">
        <p>This is paragraph tag</p>
        <div>
        <p>Hello <span>Lakshay Bindal</span></p>
        </div>
    </div>
    <h6>This is h6 heading</h6>
    <p>this is sibling of h6 heading </p>
    <p>This is second sibing of h6</p>
</body>
</html
