<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{ 
            background: #000;
            color: white;
            font-size: 40px;
        }
        .first{
            font-size: 2rem;
        }
        .second{
            font-size: 1rem;
        }
        .third{
            font-size: 25px;
            text-transform: capitalize;
        }
        .third p{
            font-size: 2em;
            font-weight: bolder;
            text-transform: uppercase;
            text-decoration: overline;
            text-shadow: 50px 75px 10px white;
        }
    </style>
</head>
<body>
    <div class="first">
        this is first class
    </div>
    <div class="second">
        this is second class
    </div>
    <div class="third">
        hello
        <p>This is paragraph in third class</p>
    </div>

</body>
</html>
