<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
        }

        .container {
            height: 100vh;
            width: 100%;
            display: grid;

            background-color: antiquewhite;

            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer";
                gap: 10px;
        }

        .box {
            border: 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .header {
            grid-area: header;
        }

        .sidebar {
            grid-area: sidebar;
        }

        .content {
            grid-area: content;
        }

        .footer {
            grid-area: footer;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box header">
            Header
        </div>

        <div class="box sidebar">
            Sidebar
        </div>

        <div class="box content">
            Content
        </div>

        <div class="box footer">
            Footer
        </div>

    </div>

</body>
</html>
