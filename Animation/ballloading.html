<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }
        .box{
            height: 100px;
            width: 100px;
            border: 1px solid black;
            border-radius: 50%;
            background-color: tomato;
            animation: bounce 1.3s infinite;
        }
        /* .box:nth-child(2){
            animation-delay: 0.3s;
        }
        .box:nth-child(3){
            animation-delay: 0.6s;
        }*/
        .box:nth-child(3){
            animation-delay: 0.3s;
        }
        .box:nth-child(2){
            animation-delay: 0.6s;
        }
        @keyframes bounce {
            0%, 100%{
                transform: translateY(0px);
            }
            50%{
                transform: translateY(100px);
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>
</html>
