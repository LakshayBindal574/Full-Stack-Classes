<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 17 Card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200vh;
            margin: 0;
            font-family: sans-serif;
        }

        .card {
            width: 250px;
            height: 350px;
            padding: 30px;
            padding-top: 50px;
            border: 1px solid black;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: 2s;
        }
        .card:hover{
            background-color: #C0CDB0;
            border-radius: 20px;
        }
        .card img {
            width: 60%;
            transition: 6s;
            margin-bottom: 30px;
            border-radius: 15px;
        }
        .card img:hover{
            transform: scale(1.2) rotate(360deg);
            border-radius: 30px;
        }

        h2 {
            font-size: 20px;
        }

        p {
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            border: 1px solid black;
            border-radius: 5px;
            color: white;
            background: #000;
            transition: 2s;
        }

        button:hover {
            border-color: #5e8332;
            background: #C0CDB0;
            color:#000
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="iPhone 17 Sage SOURCE Julian Chokkattu.webp" alt="iPhone 17">
        <h2>iPhone 17</h2>
        <p>Green Sage Color 128GB</p>
        <button>Buy</button>
    </div>

</body>
</html>
